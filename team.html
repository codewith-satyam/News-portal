{% extends 'base.html' %}
{% load static %}

{% block content %}

<!--Team Section start-->
<div class="row team py-2">
  <p class="text-center fs-3">Our <B class="text-mycolor1">Team</B></p>

  <div class="col-sm-10 mx-auto">
    <div class="row py-2">
      {% for r in tea %}
      <!--team first start-->
      <div class="col-sm-3 pb-2">
        <div class="card shadow-lg ">
          <img src="../{{r.picture}}" class="card-img-top" style="height: 320px; width: 292px;" />
          <p class="py-1 text-center fw-bold">{{r.name}}</p>

          <p class="py-1 text-center fw-bold">{{r.post}}</p>
          <!-- <p class="py-1 text-center fw-bold">{{r.experience}}</p> -->
       
        </div>
      </div>
      
      <!--team first end-->
      {% endfor %}
    </div>
  </div>
</div>
<!--Team Section end-->

{% endblock %}
