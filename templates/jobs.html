{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- start main heading -->
<div class="row text-center">
    <div class="text-center fs-3">
        <hr class="w-25 mx-auto">
        Latest <b class="text-mycolor1">Jobs <i class="fa-solid fa-graduate-cap"></i>
    </div>
    <hr class="w-50 mx-auto">
    </b>


</div>

<!-- end main heading -->
<div class="row">
    <div class="col-sm-10 mx-auto bg-light p-5">
        <div class="row">
            {% for r in jobs %}
            <!-- start jobs section -->
            <div class="col-sm-6">
                <p class="shadow-lg my-3" style="background:rgba(28, 3, 12, 0.1);" class="shadow-lg my-2">
                    <a href="{{r.job_link}}" target="_blank" class="text-dark">{{r.job_title}}</a>
                </p>
            </div>
            <!-- end jobs  section-->
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
